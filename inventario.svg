<svg xmlns="http://www.w3.org/2000/svg" width="820" height="242" viewBox="0 0 820 242" shape-rendering="crispEdges">
<style>
text{font-family:"Courier New",Consolas,monospace;font-weight:700}
.l{fill:#7CFF9E;font-size:15px}.v{fill:#E6FFE9;font-size:15px}.d{fill:#7FA88A;font-size:13px}.h{fill:#7CFF9E;font-size:13px}
.ln{animation:in .25s linear both}
.c{animation:in .15s linear both}
.blink{animation:in .2s linear both, bl 1s steps(1) infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s steps(4) both}
.slide{animation:sl .6s steps(8) both}
.glow{animation:gl 1.6s steps(2) infinite}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes bl{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes sl{0%{opacity:0;transform:translateX(860px)}100%{opacity:1;transform:translateX(0)}}
@keyframes gl{0%{stroke-opacity:1}50%{stroke-opacity:.35}}
.scan{animation:sc 6s linear infinite}
@keyframes sc{from{transform:translateY(0)}to{transform:translateY(242px)}}
</style>
