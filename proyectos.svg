<svg xmlns="http://www.w3.org/2000/svg" width="820" height="210" viewBox="0 0 820 210" shape-rendering="crispEdges">
<style>
text{font-family:"Courier New",Consolas,monospace;font-weight:700}
.l{fill:#5CE1FF;font-size:15px}.v{fill:#E8FBFF;font-size:15px}.d{fill:#7FB3BF;font-size:13px}.h{fill:#FFD23F;font-size:13px}
.ln{animation:in .25s linear both}.c{animation:in .15s linear both}
.blink{animation:in .2s linear both, bl 1s steps(1) infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s steps(4) both}
.dash{animation:da 1.2s steps(4) infinite}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes bl{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes da{to{stroke-dashoffset:-24}}
.scan{animation:sc 6s linear infinite}
@keyframes sc{from{transform:translateY(0)}to{transform:translateY(210px)}}
</style>
<rect x="0" y="0" width="820" height="210" fill="#00B8D9"/><rect x="6" y="6" width="808" height="198" fill="#04161C"/>
<rect x="0" y="0" width="6" height="6" fill="#00708A"/>
<rect x="814" y="0" width="6" height="6" fill="#00708A"/>
<rect x="0" y="204" width="6" height="6" fill="#00708A"/>
<rect x="814" y="204" width="6" height="6" fill="#00708A"/>
<text x="24" y="34" class="h">▸ PARTIDAS GUARDADAS</text><text x="796" y="34" class="h" text-anchor="end">0 PÚBLICAS</text>
<rect x="24" y="44" width="772" height="2" fill="#0B4F5E"/>
<g class="pop" style="animation-delay:0.30s"><rect class="dash" x="24" y="64" width="240" height="96" fill="#0A2530" stroke="#5CE1FF" stroke-width="2" stroke-dasharray="8 4"/><text x="40" y="90" class="h" style="font-size:12px">SLOT 01</text><text x="144" y="120" text-anchor="middle" class="v" style="font-size:14px">— VACÍO —</text><text x="144" y="142" text-anchor="middle" class="d" style="font-size:12px">Nueva partida próximamente</text></g>
<g class="pop" style="animation-delay:0.50s"><rect class="dash" x="290" y="64" width="240" height="96" fill="#0A2530" stroke="#5CE1FF" stroke-width="2" stroke-dasharray="8 4"/><text x="306" y="90" class="h" style="font-size:12px">SLOT 02</text><text x="410" y="120" text-anchor="middle" class="v" style="font-size:14px">— VACÍO —</text><text x="410" y="142" text-anchor="middle" class="d" style="font-size:12px">Nueva partida próximamente</text></g>
<g class="pop" style="animation-delay:0.70s"><rect class="dash" x="556" y="64" width="240" height="96" fill="#0A2530" stroke="#5CE1FF" stroke-width="2" stroke-dasharray="8 4"/><text x="572" y="90" class="h" style="font-size:12px">SLOT 03</text><text x="676" y="120" text-anchor="middle" class="v" style="font-size:14px">— VACÍO —</text><text x="676" y="142" text-anchor="middle" class="d" style="font-size:12px">Nueva partida próximamente</text></g>
<text class="blink" style="animation-delay:1.20s, 1.20s" x="24" y="190" fill="#FFD23F" font-size="13">&gt; CARGANDO PROYECTOS..._</text>
<rect class="scan" x="6" y="-4" width="808" height="3" fill="#5CE1FF" opacity="0.08"/>
</svg>
